[project]
name = "rag"
version = "0.3.0"
description = "Embedding fine-tuning & evaluation lab: FastAPI + Ollama + sentence-transformers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx", # Ollama embedding calls + synthetic data generation
    "numpy", # in-memory cosine for datagen hard-negatives + rag-eval ranking
    "trafilatura>=2.1.0", # rag-crawl: main-content extraction (title/description/text)
]

# Exact versions are pinned in uv.lock (the source of truth for reproducible installs).
# Run `uv sync` to install, `uv lock --upgrade` to bump to the latest compatible set.

[project.scripts]                       # every entrypoint lives in rag.cli
rag-serve = "rag.cli.serve:run"              # serve the API:          uv run rag-serve
rag-crawl = "rag.cli.crawl:main"             # site → corpus.jsonl:    uv run rag-crawl <url>
rag-gen-data = "rag.cli.gen_data:main"       # toy train/test data:    uv run rag-gen-data
rag-gen-synthetic = "rag.cli.gen_synthetic:main"  # LLM-generated data: uv run rag-gen-synthetic
rag-gen-eval = "rag.cli.gen_eval:main"       # sample BEIR eval set:   uv run rag-gen-eval
rag-gen-intranet = "rag.cli.gen_intranet:main"  # 가상 인트라넷 리허설 데이터셋: uv run rag-gen-intranet
rag-gen-clicklog = "rag.cli.gen_clicklog:main"  # 노이즈 클릭로그 리허설: uv run rag-gen-clicklog
rag-train = "rag.cli.train:main"             # fine-tune embeddings:   uv run rag-train
rag-eval = "rag.cli.evaluate:main"           # measure retrieval:      uv run rag-eval
rag-index = "rag.cli.index:main"             # corpus → Qdrant index:  uv run rag-index --model outputs/…
rag-search = "rag.cli.search:main"           # query the live index:   uv run rag-search "질문"

[dependency-groups]
# Dev tooling (installed by `uv sync`); run tests with `uv run pytest`.
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# Training-only stack — NOT required to run the server. Install with:
#   uv sync --group training
# Cross-platform: torch comes as a platform wheel (MPS on macOS, CUDA/CPU on Linux).
training = ["sentence-transformers", "datasets", "accelerate", "peft"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
